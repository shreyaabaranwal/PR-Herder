# For a real production deployment, use a managed Postgres (RDS, Cloud
# SQL, etc.) instead of this StatefulSet -- this exists so the whole
# stack is runnable end-to-end on a local cluster (kind/minikube) for
# demo purposes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pr-herder
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: prherder
            - name: POSTGRES_PASSWORD
              value: prherder
            - name: POSTGRES_DB
              value: prherder
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "prherder"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pr-herder
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
